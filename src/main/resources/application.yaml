spring:
  application:
    name: baemin

  datasource:
    url: jdbc:h2:mem:baemin
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false